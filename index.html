
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halime ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffe0eb, #ffc2d6);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.container {
    text-align: center;
    padding: 25px;
    width: 100%;
}

h1 {
    color: #d6336c;
    font-size: 30px;
    margin-bottom: 45px;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    min-height: 120px;
}

button {
    width: 220px;
    height: 75px;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    border: none;
    border-radius: 15px;
    font-size: 17px;
    line-height: 1.3;
    cursor: pointer;
    transition: transform 0.3s;
}

#hermes {
    background: #e84393;
    color: white;
    position: relative;
    z-index: 2;
}

#sogan {
    background: #2ecc71;
    color: white;
    position: relative;
    z-index: 3;
}

#message {
    color: #d6336c;
    font-size: 27px;
    font-weight: bold;
    margin-top: 35px;
    line-height: 1.5;
}

.heart {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    animation: fly 3s linear forwards;
    z-index: 10;
}

@keyframes fly {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

.luxury {
    position: fixed;
    bottom: -60px;
    font-family: Georgia, serif;
    font-weight: bold;
    pointer-events: none;
    z-index: 20;
    animation: luxuryFly 4s ease-in forwards;
    text-shadow: 0 2px 5px white;
}

@keyframes luxuryFly {
    0% {
        transform: translateY(0) rotate(-15deg) scale(0.7);
        opacity: 0;
    }
    15% {
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) rotate(30deg) scale(1.5);
        opacity: 0;
    }
}

@media (max-width: 500px) {
    h1 {
        font-size: 25px;
    }

    .buttons {
        gap: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Hangisini seçersin aşkım? ❤️</h1>

    <div class="buttons">

        <button id="hermes" onclick="chooseHermes()">
            Hermes ❤️
        </button>

        <button id="sogan" onclick="chooseSogan()">
            Ben aşkımla soğan ekmek de yerim 🧅🍞
        </button>

    </div>

    <div id="message"></div>

</div>

<script>

let soganSize = 1;

function createHearts(amount) {

    for (let i = 0; i < amount; i++) {

        let heart = document.createElement("div");

        heart.className = "heart";

        const emojis = ["❤️", "💗", "💕", "💖", "💘"];

        heart.innerHTML =
            emojis[Math.floor(Math.random() * emojis.length)];

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.fontSize =
            (20 + Math.random() * 25) + "px";

        heart.style.animationDuration =
            (2 + Math.random() * 2) + "s";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 4000);
    }
}

function createLuxury() {

    const brands = [
        { name: "LV", color: "#8b5e3c" },
        { name: "COACH", color: "#5c3825" },
        { name: "HERMÈS", color: "#e87524" }
    ];

    for (let i = 0; i < 15; i++) {

        let logo = document.createElement("div");

        let brand = brands[
            Math.floor(Math.random() * brands.length)
        ];

        logo.className = "luxury";
        logo.innerHTML = brand.name;
        logo.style.color = brand.color;
        logo.style.left = Math.random() * 90 + "vw";
        logo.style.fontSize = (20 + Math.random() * 25) + "px";
        logo.style.animationDuration =
            (3 + Math.random() * 2) + "s";

        document.body.appendChild(logo);

        setTimeout(() => logo.remove(), 5000);
    }
}

function chooseHermes() {

    soganSize += 0.25;

    document.getElementById("sogan").style.transform =
        `scale(${soganSize})`;

    createHearts(10);
    createLuxury();
}

function chooseSogan() {

    document.querySelector("h1").innerHTML =
        "DOĞRU CEVAP! 🥹❤️";

    document.querySelector(".buttons").style.display =
        "none";

    document.getElementById("message").innerHTML =
        "Düşünceli aşkım benim, biliyordum bunu seçeceğini! ❤️😘";

    createHearts(40);
    createLuxury();
}

</script>

</body>
</html>
